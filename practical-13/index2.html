<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS ANIMATIONS</title>
    <style>
        .container{
            background-color: purple;
            width:30vw;
            height:80vh;
        }
        .box{
            width:34px;
            height:45px;
            border-radius: 50%;
            /* animation-name: myanimation;
            animation-duration: 1s;
            animation-iteration-count: 3;
            animation-timing-function:ease-in-out;
            animation-delay:1s;
            animation-direction: reverse; */
            /* animation-play-state: paused; */
            animation: myanimation2 3s ease-in-out 1s infinite, myanimation 3s ease-in-out 1s 1, myanimation3 5s ease-in 3s 1;
        }
        @keyframes myanimation{
            from{
                background-color: rgb(186, 248, 43);
            }
            to{
                background-color: rgb(247, 231, 61);
                transform:translateY(70vh);
            }
        }
        @keyframes myanimation3{
            from{
                transform:translateY(70vh);
            }
            to{
                transform:ttranslateY(-70vh);
            }
        }
        @keyframes myanimation2 {
            0%{
                transform: rotate(100deg);
            }
            20%{
                transform: rotate(200deg);
            }
            50%{
                transform:rotate(220deg);
            }
            80%{
                transform:rotate(300deg);
            }
            100%{
                transform:rotate(310deg);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="box"></div>
    </div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>More on CSS Selector</title>
    <style>
        .box:first-child{
            background-color: red;
        }
        .box::first-line{
            color:rgb(141, 141, 20);
        }
        .boxes *{
            color:blue;
            border:2px solid rgb(246, 181, 181);
        }
        .boxes::before{
            content:"You are bad";
            color:blue;
        }
        .boxes::after{
            content:"You are good";
            color:rgb(0, 195, 255);
        }
        .box::first-letter{
            color:rgb(0, 238, 255);
            font-size: 40px;
        }
        input::placeholder{
            color:blueviolet;
        }
        ::selection{
            background-color: rgb(0, 238, 255);
            color:black;
        }
    </style>
</head>
<body>
    <div class="boxes">
        <div class="box">I am first box.</div>
        <div class="box">I am a box</div>
        <div class="box">I am a box</div>
        <input type="text" placeholder="Enter your name">
    </div>
</body>
</html>

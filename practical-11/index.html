<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Variables</title>
    <style>
        :root{
            --color: rgb(244, 244, 94);
            --defop:0.4;
            --defpad:23px;
            --seccolor: rgb(95, 95, 37);
        }
        *{
            margin: 0;
            padding: 0;
        }
        .nav{
            background-color: var(--color);
        }
        ul{
            display:flex;
        }
        ul li{
            list-style: none;
            opacity: var(--defop);
            padding: var(--defpad);
            border: 2px solid rgb(5, 25, 25);
        }
        ul li:first-child{
            background-color: var(--seccolor);
        }
    
        
    </style>
</head>
<body>
    <div class="nav">
        <ul>
            <li>Home</li>
            <li>About</li>
            <li>Contact</li>
        </ul>
    </div>
    <div class="container">
        Lorem ipsum dolor sit, amet consectetur adipisicing elit. Laboriosam eaque magnam dolorum consequuntur minus reiciendis hic iste accusamus quas molestias.
    </div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Media Query</title>
    <style>
        body{
            background-color: red;
        }
        @media screen and (orientation:portrait){
            body{
                border:2px solid rgb(249, 247, 249);
            }
        }
        @media only screen and (max-width:455px){
            body{
                background-color: blue;
                color: white;
            }
            .boxes{
                flex-direction:column;
            }
        }
        
        .boxes{
            display:flex;
        }
        .box{
            background-color: rgb(147, 210, 249);
            height: 344px;
            width: 344px;
            padding: 3px;
            margin:3px;
        }
    </style>
</head>
<body>
    <div>
        Hey I am a red body guy!
    </div>
    <div class="boxes">
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
    </div>
</body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Event Bubbling</title>
    <style>
      .child {
        background-color: aliceblue;
        border: 2px solid black;
        padding: 14px;
        margin: 14px;
        cursor: pointer;
      }
      .childContainer {
        background-color: blanchedalmond;
        margin: 14px;
        padding: 14px;
        border: 2px solid black;
      }
      .container {
        background-color: chartreuse;
        margin: 14px;
        padding: 14px;
        border: 2px solid black;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <section class="childContainer">
        <div class="child">I am a child</div>
      </section>
    </div>
    <script>
      document.querySelector(".child").addEventListener("click", (e) => {
        e.stopPropagation();
        alert("Child was clicked");
      });
      document
        .querySelector(".childContainer")
        .addEventListener("click", (e) => {
          alert("Child container was clicked");
          e.stopPropagation();
        });
      document.querySelector(".container").addEventListener("click", (e) => {
        alert("Container was clicked");
      });

      function getRandomColor() {
        let val1 = Math.ceil(0 + Math.random() * 255);
        let val2 = Math.ceil(0 + Math.random() * 255);
        let val3 = Math.ceil(0 + Math.random() * 255);
        return `rgb(${val1},${val2},${val3})`;
      }
    //   let a=setInterval(()=>{
    //     document.querySelector(".childContainer").style.background=getRandomColor();
    //   },1000);
    //   let b=setInterval(()=>{
    //     document.querySelector(".child").style.background=getRandomColor();
    //     document.querySelector(".child").style.color=getRandomColor();
    //   },1000);
    let a=setTimeout(()=>{
        document.querySelector(".child").style.background=getRandomColor();
    },2000)
    </script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Layout</title>
    <style>
      * {
        margin: 0;
        padding: 0;
      }
      header {
        position: sticky;
        top: 0;
      }
      nav {
        background-color: burlywood;
        height: 83px;
      }
      main {
        background-color: beige;
        color: rgb(58, 62, 12);
        padding: 34px;
      }
      .container {
        background-color: blanchedalmond;
        margin: 12px 34px;
        padding: 55px 23px;
        text-align: center;
      }
      .box1 {
        background-color: rgba(250, 235, 215, 0.806);
        height: 70vh;
        width: 45%;
        margin: 0px 12px;
        display: inline-block;
      }
      .box2 {
        background-color: rgb(254, 194, 116);
        height: 70vh;
        width: 45%;
        margin: 0px 12px;
        display: inline-block;
      }
      .text-box {
        padding: 34px;
        border: 2px solid white;
        margin: 50px 34vw;
        font-size: 2em;
        border-radius: 13px;
      }
      .orange-box {
        background: orange;
        height: 32px;
        width: 32px;
        position: fixed;
        bottom: 12px;
        right: 23px;
        border-radius: 60px;
      }
      footer {
        height: 100px;
        background-color: rgb(249, 215, 159);
      }
      nav ul{
        display:flex;
        list-style: none;
        margin: 0 23px;
        padding:23px;
        gap:23px;
      }
      h1{
        text-align: center;
      }
    
      li{
        font-size: 18px;
    }
    </style>
  </head>
  
  <body>
    <header>
      <nav>
        <ul>
          <li>Home</li>
          <li>About</li>
          <li>Contact</li>
        </ul>
      </nav>
    </header>
    <main>
        <h1>THIS IS A LAYOUT PAGE</h1>
      <div class="container">
        <div class="box1"></div>
        <div class="box2"></div>
        <div class="text-box">
          <p>Welcome to my layout page !</p>
        </div>
      </div>
      <div class="orange-box"></div>
    </main>
    <footer></footer>
  </body>
</html>

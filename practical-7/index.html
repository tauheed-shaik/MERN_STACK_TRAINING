<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS BOX MODEL</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }
        .box{
            background-color:aqua;
        }
        .box1{
            color:rgb(147, 147, 19);
            padding:10px;
            margin:35px;
            border: 2px solid blue;
            height:200px;
            box-sizing:border-box;
        }
        .box2{
            color:rgb(37, 26, 244);
            padding:10px;
            margin:35px;
            border: 2px solid rgb(21, 230, 25);
            height:200px;
            box-sizing:border-box;
            width:200px;
        }

    </style>
</head>
<body>
    <div class="box box1">
        I am a box.
    </div>
    <div class="box2 box">
        I am another box
    </div>
    
</body>
</html>

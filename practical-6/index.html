<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS SELECTORS</title>
    <style>
        h1 {
            color: yellow;
        }

        #green {
            color: green;
        }

        .bg-yellow {
            background-color: yellow;
        }

        #blue {
            color: blue;
        }
    </style>
</head>

<body>
    <h1>CSS SELECTORS</h1>
    <h2 id="green">Types of Selectors</h2>
    <div class="bg-yellow">
        <h2 id="yellow">Types of Selectors</h2>
        <h2 id="blue">Types of Selectors</h2>
        <h2 id="red">Types of Selectors</h2>
    </div>
</body>

</html>
